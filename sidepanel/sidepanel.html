<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Clipboard Archive</title>
    <link rel="stylesheet" href="sidepanel.css" />
  </head>
  <body>
    <aside id="rail" aria-label="Filters">
      <h3>Types</h3>
      <ul id="type-list" role="list" aria-label="Type filters"></ul>
      <h3>Tags</h3>
      <ul id="tag-list" role="list" aria-label="Tag filters"></ul>
      <label class="pinned-toggle">
        <input type="checkbox" id="pinned-only" /> Pinned only
      </label>
    </aside>
    <section id="list-pane" aria-label="Clipboard items">
      <input id="search" type="search" placeholder="Search…" autocomplete="off" aria-label="Search clipboard items" />
      <ul id="clips" role="listbox" aria-label="Clipboard items"></ul>
    </section>
    <section id="detail" aria-label="Clip detail">
      <p id="placeholder">Select a clip to view details</p>
      <div id="detail-content" hidden>
        <pre id="d-text" aria-label="Clip text"></pre>
        <p id="d-source"></p>
        <p id="d-date"></p>
        <div id="d-tags" aria-label="Tags"></div>
        <input id="d-tag-input" placeholder="Add tag and press Enter" aria-label="Add tag" />
        <div class="detail-buttons">
          <button id="d-pin" type="button">Pin</button>
          <button id="d-copy" type="button">Copy</button>
          <button id="d-delete" type="button" class="danger">Delete</button>
        </div>
      </div>
    </section>
    <script type="module" src="sidepanel.js"></script>
  </body>
</html>
