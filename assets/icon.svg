<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b7bff"/>
      <stop offset="100%" stop-color="#1f4fcc"/>
    </linearGradient>
    <linearGradient id="sparkleGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffe45e"/>
      <stop offset="100%" stop-color="#ffb800"/>
    </linearGradient>
  </defs>

  <!-- Rounded square background -->
  <rect x="0" y="0" width="128" height="128" rx="28" fill="url(#bgGrad)"/>

  <!-- Clipboard board -->
  <rect x="30" y="34" width="68" height="82" rx="7" fill="#ffffff"/>

  <!-- Clip at top -->
  <rect x="46" y="22" width="36" height="20" rx="5" fill="#ffffff"/>
  <rect x="50" y="26" width="28" height="12" rx="3" fill="#1f4fcc"/>

  <!-- Content lines -->
  <rect x="40" y="58" width="48" height="5" rx="2.5" fill="#3b7bff" opacity="0.35"/>
  <rect x="40" y="70" width="40" height="5" rx="2.5" fill="#3b7bff" opacity="0.35"/>
  <rect x="40" y="82" width="44" height="5" rx="2.5" fill="#3b7bff" opacity="0.35"/>

  <!-- AI sparkle (four-pointed star, lower right) -->
  <path
    d="M 92 92
       L 96 100
       L 104 104
       L 96 108
       L 92 116
       L 88 108
       L 80 104
       L 88 100
       Z"
    fill="url(#sparkleGrad)"
    stroke="#1f4fcc"
    stroke-width="1.5"
  />
</svg>
